  - id: ice.legacy.tier3_ice_b_shatter_radius
    classification: declarative
    kind: value
    value: 80
    sources:
    - src.core
    - src.config
    effective: 资源值 = .tres 覆盖（core.tres:72；config.gd:284 默认同值且 DEPRECATED）。现行 A/B 无生效消费；兼容残留，排除发布 IR。
