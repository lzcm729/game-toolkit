    classification: declarative
    kind: value
    value: 0.4
    sources:
    - src.core
    - src.config
    effective: 资源值 = .tres 覆盖（core.tres:73；config.gd:285 默认同值且 DEPRECATED）。现行 A/B 无生效消费；兼容残留，排除发布 IR。
  - id: ice.legacy.tier3_ice_b_shatter_slow_duration
    classification: declarative
    kind: value
    value: 0.8
    sources:
    - src.core
    - src.config
    effective: 资源值 = .tres 覆盖（core.tres:74；config.gd:286 默认同值且 DEPRECATED）。现行 A/B 无生效消费；兼容残留，排除发布 IR。
  - id: ice.legacy.tier3_ice_b_shatter_slow_factor
    classification: declarative
    kind: value
    value: 0.5
    sources:
    - src.core
