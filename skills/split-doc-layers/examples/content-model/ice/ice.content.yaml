catalogs:
- id: catalog.recipes.with-ice
  fields:
  - id: catalog.recipes.selector
    classification: declarative
    kind: value
    value: data/recipes/*ice*.tres
    sources:
    - src.recipes
    effective: 在固定上游版本只读 glob；逐份核对 toppings 包含 ice。当前查询返回集合，未手抄成员表。
  - id: catalog.recipes.count
    classification: declarative
    kind: value
    value: 12
    sources:
    - src.recipes
    effective: 该版本 glob 命中数且逐份 toppings 含 ice；快照观测值，不作为未来数量硬约束。检查器只解析集合 ID，不执行 glob 或核对数量。
mechanisms:
- id: mechanism.ice-brittle
  status: gap
  fields:
  - id: mechanism.ice-brittle.home
    classification: interpretive
    kind: value
    value: 归属缺口：docs/GDD 尚无足够实施的现行 A 契约。mastery-and-inspiration.md:37 已有脆冻勘误（不是完全没出现），正文:96,126 仍用旧 B 冰晶爆例子。现行详细设计文字主要落在卡片:273
      与 commit 437e02f，不能以代码替代机制契约。
    sources:
    - src.gdd
    - src.card
    - src.decision
    effective: 本地索引 ID 只给缺口一个可引用身份，不声称项目已有此 ID 的正式契约。
    owner: Framework
- id: mechanism.ice-hanchao
  status: gap
  fields:
  - id: mechanism.ice-hanchao.home
    classification: interpretive
    kind: value
    value: 归属缺口：docs/GDD 的现行 B 只有勘误式说明，未找到完整触发、接收者、并发/合并、事件顺序契约。现行详细设计文字主要在卡片:278 与 commit 437e02f；GDD:96,126 仍残留冰晶爆。天气文档中的同名寒潮不能充当此分支的家。
    sources:
    - src.gdd
    - src.card
    - src.decision
    - src.effect
    effective: 标归属缺口交 Framework，不在内容样板补造规则。
    owner: Framework
instances:
- id: ice
  version: 3f93fff80432653f12e28076c4493f62252d3836
  identity:
  - id: ice.name
    classification: declarative
    kind: value
    value: 冰块
    sources:
    - src.library
    effective: _META[ice].name_cn 的已登记名称。
  - id: ice.position
    classification: interpretive
    kind: value
    value: 单体硬控；冻结目标使其停驻。
    sources:
    - src.recipe
    - src.card
    effective: 作者定位摘要；需核对 Framework 语义，不定义执行规则。
    owner: Framework
  - id: ice.scope
    classification: interpretive
    kind: value
    value: 本样板只读已采纳分支与其直接参数/关系；不是全游戏平衡表，不代表现有项目已接入作者工作台。
    sources:
    - src.sample
    effective: 样板阅读范围；未发布到游戏。
    owner: C
  adopted:
    fields:
    - id: ice.freeze_seconds
      classification: declarative
      kind: value
      value: 1.5
      sources:
      - src.core
      - src.config
      - src.effect
      effective: 有效值 = .tres 覆盖：core.tres:118；config.gd:370 默认同值。单位秒；加载 Config 后由 ice_freeze_effect.gd:28 读取，尚会经过
        tier2 缩放。
    - id: ice.tier2_per_level
      classification: declarative
      kind: value
      value: 0.4
      sources:
      - src.config
      - src.core
      - src.effect
      - src.mastery
      effective: 有效值 = 脚本默认：config.gd:227；core.tres 无此键。无量纲；effect:31 调 mastery:78-79，以运行时等级缩放基础时长。
    - id: ice.hud_effect
      classification: declarative
      kind: value
      value: 冰冻1.5秒
      sources:
      - src.recipe
      effective: data/recipes/ice.tres:15 的字面字符串；recipe_data.gd:16 将 effect 定义为 HUD 短标签；字符串中的时长不参与结算，也不随 Config
        自动更新。
    - id: ice.display_coupling
      classification: interpretive
      kind: value
      value: 展示字段与数值耦合：HUD 标签手抄基础冻结秒数；即便此快照相等，调参、tier2 深化或 B 分摊后也不能据此推出实际持续时长。未在本任务验证当前 HUD 是否消费它。
      sources:
      - src.recipe
      - src.effect
      effective: 待 Interface 审核展示策略；不在样板改文案或补插值机制。
      owner: Interface
    - id: ice.recipes
      classification: declarative
      kind: relation
      value:
      - catalog.recipes.with-ice
      sources:
      - src.recipes
      effective: 关系引用到外部配方集合；成员由项目查询解析，不复制十二条清单。
    - id: ice.branches
      classification: declarative
      kind: branch_refs
      value:
      - ice.A
      - ice.B
      sources:
      - src.card
      - src.decision
      effective: 已采纳的分支身份；某盘是否选择它属于运行时状态。
    - id: ice.tier2_current_vs_card
      classification: interpretive
      kind: value
      value: 卡片称 tier2 纯时长深化，但当前代码在冻结自然衰减结束且 tier2 已购时仍生成冰区。这里只报告当前实现，不把残留实现反推为新采纳规则。
      sources:
      - src.card
      - src.zone
      effective: 语义分歧，交 Framework 核实 de-smear 意图与残留路径。
      owner: Framework
    branches:
    - id: ice.A
      fields:
      - id: ice.A.name
        classification: declarative
        kind: value
        value: 脆冻
        sources:
        - src.card
        - src.decision
        effective: 卡片:272 与已采纳决策的分支名。
      - id: ice.A.mechanism
        classification: declarative
        kind: mechanism_refs
        value:
        - mechanism.ice-brittle
        sources:
        - src.decision
        - src.gdd
        effective: 引用本样板机制索引 ID；status=gap，未伪造完整契约。
      - id: ice.A.damage_mult
        classification: declarative
        kind: value
        value: 1.5
        sources:
        - src.config
        - src.core
        - src.hit
        - src.brittle
        effective: 有效值 = 脚本默认：config.gd:288；core.tres 无此键。无量纲；brittle:837 乘调用方传入的 a.damage，不是主命中 dmg 修改链后的值。
      - id: ice.A.current_implementation
        classification: interpretive
        kind: value
        value: 当前实现：先主命中伤害，再 snapshot was_frozen_pre，再派发 effects。碎裂独立判断 c.alive、配方 toppings 含 ice、was_frozen_pre、mastery
          非空且 is_tier3_a(ice)。effects 非空不是碎裂的直接门槛；额外伤后目标仍活着才 clear freeze。
        sources:
        - src.hit
        - src.brittle
        effective: 这是固定 HEAD 的代码解读，需 Framework 语义复核；不扩大为任何攻击均触发。
        owner: Framework
      - id: ice.A.binding
        classification: interpretive
        kind: value
        value: resolve_hits → _apply_ice_brittle(c, a.damage, a.recipe)；机制引用记录契约缺口，源码位置仅为 C 层绑定。
        sources:
        - src.hit
        - src.brittle
        effective: 只读实现定位；不作为可执行作者 DSL。
        owner: C
    - id: ice.B
      fields:
      - id: ice.B.name
        classification: declarative
        kind: value
        value: 寒潮
        sources:
        - src.card
        - src.decision
        effective: 卡片:277 与已采纳决策的分支名；不是同名天气的身份。
      - id: ice.B.mechanism
        classification: declarative
        kind: mechanism_refs
        value:
        - mechanism.ice-hanchao
        sources:
        - src.decision
        - src.gdd
        effective: 引用本样板机制索引 ID；status=gap。
      - id: ice.B.radius
        classification: declarative
        kind: value
        value: 80
        sources:
        - src.config
        - src.core
        - src.effect
        effective: 有效值 = 脚本默认：config.gd:289；core.tres 无 hanchao_radius。单位为当前项目位置坐标长度；effect:47,52-53 用距离平方筛选。不要错用
          core.tres:72 同值的旧 shatter_radius。
      - id: ice.B.max_targets
        classification: declarative
        kind: value
        value: 4
        sources:
        - src.config
        - src.core
        - src.effect
        effective: 有效值 = 脚本默认：config.gd:290；core.tres 无 hanchao_max_targets。单位个，含命中目标；effect:56-60 按实际接收者数平分。脚本注释建议降到
          3 尚待裁决，未采用。
      - id: ice.B.current_implementation
        classification: interpretive
        kind: value
        value: 当前实现：运行时选 B 且 customers 非空时，在命中目标与半径内最近的存活邻居之间平分本次冻结预算；先做 tier2 缩放，人数上限包含原目标。分摊事件后还经过通用 buff 合并与天气冰冻条，事件预算守恒不等于最终
          buff 剩余总时长严格守恒。
        sources:
        - src.effect
        - src.mastery
        - src.buff
        effective: 源码解读，归 Framework 复核；未将代码整理成新契约。
        owner: Framework
      - id: ice.B.binding
        classification: interpretive
        kind: value
        value: IceFreezeEffect.on_hit → _emit_hanchao_split → buff_apply_requested；当前实现按距离排序取邻居。
        sources:
        - src.effect
        effective: 仅 C 层来源绑定，不是新增通用操作符。
        owner: C
  release:
  - id: ice.library_present
    classification: declarative
    kind: value
    value: true
    sources:
    - src.library
    effective: _ALL_IDS 与 _META 已收录；静态入库事实。
  - id: ice.library_index
    classification: declarative
    kind: value
    value: 4
    sources:
    - src.library
    effective: _ALL_IDS:10 中从零计的位置（第五项）；加载库的顺序约束，不能在原位置前插入/重排。
  - id: ice.rng_constraint
    classification: interpretive
    kind: value
    value: _ALL_IDS 前段位置锁定，新增 ID 追加末尾；源注释将索引绑定到 trace RNG 映射。这是集合发布约束，不能按名称排序发布。
    sources:
    - src.library
    effective: 发布/导出时保序；具体确定性要求由 Framework 复核。
    owner: Framework
  - id: ice.default_active
    classification: declarative
    kind: value
    value: true
    sources:
    - src.library
    effective: DEFAULT_ACTIVE:13 包含 ice；仅默认出战集合，不保证任一当前盘实际出战。
  - id: ice.runtime_boundary
    classification: interpretive
    kind: value
    value: purchased_tier3 与 tier3_path 由 MasterySystem 持有；is_tier3_a/b 查询购买状态和路径。A/B 定义是内容，玩家已买/已选何支是状态，作者模型与发布
      IR 不存某个玩家的选择。当前出战列表应查询 RunLoadout。
    sources:
    - src.mastery
    - src.library
    effective: 运行时按 Framework 查询；不把两个分支的已实现状态当成同时启用。
    owner: Framework
  - id: ice.delivery_observation
    classification: interpretive
    kind: value
    value: 当前源码含 A/B 实现；卡片:265 仍写“设计·待实装”。仅确认仓库实现存在，未运行引擎、未确认发行包、没有在本次发布游戏。
    sources:
    - src.card
    - src.effect
    - src.brittle
    effective: 源码快照与卡片状态分开；运行/发行验证未知。
    owner: C
  - id: ice.deprecated_boundary
    classification: interpretive
    kind: value
    value: 以下七项为序列化兼容残留，资源加载值仍存在，但现行 A/B 不消费。不能作为现行平衡参数，也不能据值相等映射到新字段。
    sources:
    - src.core
    - src.config
    - src.hit
    - src.effect
    - src.brittle
    effective: core.tres:69-75 对应 config.gd:281-287 DEPRECATED；只记录残留，不删除工程字段。
    owner: C
  - id: ice.legacy.tier3_ice_a_freeze_duration_mult
    classification: declarative
    kind: value
    value: 2.3
    sources:
    - src.core
    - src.config
    effective: 资源值 = .tres 覆盖（core.tres:69；config.gd:281 默认同值且 DEPRECATED）。现行 A/B 无生效消费；兼容残留，排除发布 IR。
