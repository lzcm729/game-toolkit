    effective: 资源值 = .tres 覆盖（core.tres:75；config.gd:287 默认同值且 DEPRECATED）。现行 A/B 无生效消费；兼容残留，排除发布 IR。
  discussion:
  - id: discussion.ice.A.wording
    target: ice.A
    target_version: 3f93fff80432653f12e28076c4493f62252d3836
    fields:
    - id: ice.discussion.A.title
      classification: declarative
      kind: value
      value: 📝 我的意见
      sources:
      - src.card
      effective: 卡片:274 原栏为空，本样板未代填用户观点。
    - id: ice.discussion.A.proposed_description
      classification: interpretive
      kind: value
      value: 拟议描述/待对齐：冻结中的敌人受到攻击 → 碎裂、立刻解冻，对被冰封的敌人造成一次额外伤害。
      sources:
      - src.card
      effective: 引用卡片:273；该宽泛描述已有历史采纳背景，但不视为当前代码完全实现或本次批准扩展触发范围。
      owner: Framework
    - id: ice.discussion.A.question
      classification: interpretive
      kind: value
      value: 样板讨论问题（由 Codex 编写，非用户意见）：应收窄卡片为含冰主命中触发，还是修改实现让其他攻击也能打碎？需 Framework 裁决；两边暂不改。
      sources:
      - src.sample
      - src.hit
      - src.card
      effective: 仅讨论，针对本快照；接受后另更新所属契约与正式定义，禁止直接发布本条。
      owner: Framework
